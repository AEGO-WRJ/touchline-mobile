name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build signed APK
        env:
          SIGNING_BASE64: ${{ secrets.SIGNING_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_STORE: ${{ runner.temp }}/touchline.p12
        run: |
          printf '%s' "$SIGNING_BASE64" | base64 --decode > "$SIGNING_STORE"
          gradle :app:assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Touchline-Android
          path: app/build/outputs/apk/release/app-release.apk
