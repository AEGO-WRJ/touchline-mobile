plugins { id 'com.android.application' }
android {
    namespace 'com.touchline.mobile'
    compileSdk 35
    defaultConfig { applicationId 'com.touchline.mobile'; minSdk 28; targetSdk 35; versionCode 13; versionName '1.6.3' }
    sourceSets { main { assets.srcDirs = ['../web'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('SIGNING_STORE')) {
                storeFile file(System.getenv('SIGNING_STORE'))
                storePassword System.getenv('SIGNING_PASSWORD')
                def store = java.security.KeyStore.getInstance('PKCS12')
                file(System.getenv('SIGNING_STORE')).withInputStream { store.load(it, System.getenv('SIGNING_PASSWORD').toCharArray()) }
                keyAlias store.aliases().nextElement()
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
