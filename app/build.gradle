plugins { id 'com.android.application' }
android {
    namespace 'com.touchline.mobile'
    compileSdk 35
    defaultConfig { applicationId 'com.touchline.mobile'; minSdk 28; targetSdk 35; versionCode 1; versionName '1.0.0' }
    sourceSets { main { assets.srcDirs = ['../web'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('SIGNING_STORE')) {
                storeFile file(System.getenv('SIGNING_STORE'))
                storePassword System.getenv('SIGNING_PASSWORD')
                keyAlias 'touchline'
                keyPassword System.getenv('SIGNING_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
}
